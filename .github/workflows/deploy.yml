# ============================================================
#  CI/CD — Deploy ke Firebase Hosting
# ------------------------------------------------------------
#  Otomatis build & deploy setiap ada push ke branch main.
#  Preview channel dibuat otomatis untuk setiap Pull Request.
#
#  SETUP WAJIB (satu kali):
#  1. Buka repository di GitHub → Settings → Secrets and variables
#     → Actions → New repository secret
#  2. Tambahkan secret:
#     - Name : FIREBASE_SERVICE_ACCOUNT
#     - Value: isi dengan Service Account JSON
#               (lihat bagian "Cara dapat Service Account" di README.md)
# ============================================================

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------------
  #  Build
  # ----------------------------------------------------------
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ----------------------------------------------------------
  #  Deploy ke Production (hanya saat push ke main)
  # ----------------------------------------------------------
  deploy-production:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Firebase Hosting (Live Channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: massbim-web

  # ----------------------------------------------------------
  #  Deploy Preview (hanya saat Pull Request)
  # ----------------------------------------------------------
  deploy-preview:
    name: Deploy Preview
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Firebase Hosting (Preview Channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: massbim-web
          # Preview channel dibuat otomatis, URL-nya dikomentarkan ke PR
